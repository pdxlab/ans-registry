# Build the ans-registry container image and push to Artifact Registry.
# Manual deploy to Cloud Run is performed from the resulting tag — auto-
# deploy is a later phase, matching agp-control-plane's runbook.
#
# Registry path produced by this workflow:
#   us-central1-docker.pkg.dev/splendid-sector-362217/predixtions/ans-registry:<tag>
#
# Tags pushed per build:
#   <branch>-<short-sha>   e.g. TRUS-1257-2c7fd0f
#   <short-sha>            e.g. 2c7fd0f
#   <branch>-latest        e.g. TRUS-1257-latest  (overwrites)
#   latest                 (only on main)
#
# Auth: Workload Identity Federation impersonating the Compute Engine
# default SA. Repo secrets required:
#   GCP_WIF_PROVIDER  — projects/749654864884/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
#   GCP_SA_EMAIL      — 749654864884-compute@developer.gserviceaccount.com

name: build-and-push-image

on:
  push:
    branches:
      - main
      - 'TRUS-**'
      - 'PSS1-**'
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: splendid-sector-362217
  GAR_REGION: us-central1
  GAR_REPO: predixtions
  IMAGE_NAME: ans-registry

jobs:
  # ── C-2: lint + tests gate the image build ─────────────────────────────
  test:
    name: Lint + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Alembic dry-run (offline)
        # Catches broken migrations without needing a live DB.
        env:
          APP_ENV: development
          ANS_RUN_AUTO_CREATE: '0'
        run: |
          alembic upgrade head --sql > /tmp/alembic.sql
          test -s /tmp/alembic.sql
          head -20 /tmp/alembic.sql

      - name: Run pytest
        env:
          APP_ENV: development
        run: |
          pytest -q --maxfail=5 --disable-warnings

  # ── C-1: build + push image to Artifact Registry ───────────────────────
  build-push:
    name: Build + Push
    needs: test
    # PRs only run the test job. Image builds + pushes happen on branch
    # pushes (main, TRUS-**, PSS1-**) and on workflow_dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Derive image tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          # Branch names may contain slashes; sanitize for tag rules.
          SAFE_BRANCH="${BRANCH//\//-}"
          SHORT_SHA="${GITHUB_SHA::7}"
          REGISTRY="${GAR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO}/${IMAGE_NAME}"

          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "primary=${REGISTRY}:${SAFE_BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch_latest=${REGISTRY}:${SAFE_BRANCH}-latest" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${REGISTRY}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${SAFE_BRANCH}" == "main" ]]; then
            echo "latest=${REGISTRY}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "latest=" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${GAR_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.primary }}
            ${{ steps.tags.outputs.branch_latest }}
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.latest }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.branch_latest }}
          cache-to: type=inline
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Summary
        run: |
          {
            echo "## Image pushed"
            echo ""
            echo '```'
            echo "${{ steps.tags.outputs.primary }}"
            echo '```'
            echo ""
            echo "Manual deploy to Cloud Run QA:"
            echo '```bash'
            echo "gcloud run deploy ans-registry-qa \\"
            echo "  --image='${{ steps.tags.outputs.primary }}' \\"
            echo "  --region='${GAR_REGION}' \\"
            echo "  --project='${GCP_PROJECT_ID}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
